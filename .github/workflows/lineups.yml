name: NBA lineups (prueba)

on:
  schedule:
    # 21:17 UTC todos los días (minuto "raro" para evitar los retrasos de GitHub en la hora en punto)
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Solo publicar un mensaje de ejemplo"
        type: boolean
        default: false

concurrency:
  group: nba-lineups
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vigilar partidos de hoy
        run: node spike/lineup-spike.mjs --league nba ${{ inputs.test && '--test' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Guardar log de la medición
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineup-log-${{ github.run_id }}
          path: |
            spike/log-*.csv
            spike/state-*.json
          if-no-files-found: ignore
